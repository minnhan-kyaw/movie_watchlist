<div class="form-grid">
    
    <div class="form-group full-width">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Venom" maxlength="100" 
               value="{{ request.form.get('title', movie.title if movie else '') }}" >
    </div>

    <div class="form-group">
        <label for="release_year">Release Year</label>
        <input type="number" id="release_year" name="release_year" placeholder="2006" min="1888" max="2026" 
               value="{{ request.form.get('release_year', movie.release_year if movie else '') }}">
    </div>

    <div class="form-group">
        <label for="genre">Genre</label>
        <select id="genre" name="genre" >
            {% set selected_genre = request.form.get('genre', movie.genre if movie else '') %}
            <option value="" disabled {% if not selected_genre %}selected{% endif %}>Select Genre</option>
            {% for g in ['Action', 'Comedy', 'Drama', 'Sci-Fi', 'Thriller', 'Horror', 'Romance', 'Other'] %}
                <option value="{{ g }}" {% if selected_genre == g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="rating">Rating</label>
        <select id="rating" name="rating">
            {% set selected_rating = request.form.get('rating', movie.rating|string if movie else '1') %}
            {% for r in range(1, 6) %}
                <option value="{{ r }}" {% if selected_rating == r|string %}selected{% endif %}>{{ r }} Star{{ 's' if r > 1 else '' }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
            {% set selected_status = request.form.get('status', movie.status if movie else 'To-Watch') %}
            <option value="To-Watch" {% if selected_status == 'To-Watch' %}selected{% endif %}>To-Watch</option>
            <option value="Watching" {% if selected_status == 'Watching' %}selected{% endif %}>Watching</option>
            <option value="Watched" {% if selected_status == 'Watched' %}selected{% endif %}>Watched</option>
        </select>
    </div>

    <div class="form-group full-width">
        <label for="notes">Notes</label>
        {% set selected_notes = request.form.get('notes', movie.notes if movie and movie.notes != 'This movie have no notes.' else '') %}
        <textarea id="notes" name="notes" rows="3" placeholder="Your thoughts..." maxlength="500">{{ selected_notes }}</textarea>
    </div>

</div> 

<div class="form-actions">
    <a href="{{ url_for('movies.index') }}" class="btn-cancel">Cancel</a>
    <button type="submit" class="btn-save">
        {% if 'edit' in request.endpoint %}Save Changes{% else %}Add Movie{% endif %}
    </button>
</div>
