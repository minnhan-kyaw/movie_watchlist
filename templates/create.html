<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Add New Movie</title>
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Add New Movie</h3>
                </div>
                <div class="card-body">
                    <form action="/movies/create" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Movie Title</label>
                            <input type="text" name="title" class="form-control" placeholder="Enter title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Genre</label>
                            <input type="text" name="genre" class="form-control" placeholder="Action, Comedy, etc.">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Release Year</label>
                            <input type="number" name="release_year" class="form-control" placeholder="2024">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="3"></textarea>
                        </div>
                          <label class="form-label">Status</label>
                            <select name="status" class="form-select" required>
                                <option value="Plan to Watch">Plan to Watch</option>
                                <option value="Watching">Watching</option>
                                <option value="Watched">Watched</option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/movies" class="btn btn-secondary">Back to List</a>
                            <button type="submit" class="btn btn-success">Save Movie</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
