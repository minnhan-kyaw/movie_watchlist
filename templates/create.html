<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Movie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="form-container">
    <a href="/movies" class="back-link" >
        Back to Watchlist
    </a>
    <h2>Add New Movie</h2>
    <form action="/movies/create" method="POST">
        <div class="form-group">
            <label>Movie Title</label>
            <input type="text" name="title" placeholder="Enter movie title" required>
        </div>

        <div class="form-group">
            <label>Genre</label>
            <select name="genre">
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Sci-fi">Sci-fi</option>
                <option value="Triller">Triller</option>
                <option value="Horror">Horror</option>
                <option value="Romance">Romance</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Release Year</label>
            <input type="number" name="release_year" placeholder="2024">
        </div>

        <div class="form-group">
            <label>Rating</label>
            <select name="rating">
                <option value="1">1 Star</option>
                <option value="2">2 Stars</option>
                <option value="3">3 Stars</option>
                <option value="4">4 Stars</option>
                <option value="5">5 Stars</option>
            </select>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="To-Watch">To-Watch</option>
                <option value="Watching">Watching</option>
                <option value="Watched">Watched</option>
            </select>
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3" placeholder="Your thoughts..."></textarea>
        </div>

        <div class="form-actions">
            <a href="/movies" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">Save Movie</button>
        </div>
    </form>
</div>

</body>
</html>
