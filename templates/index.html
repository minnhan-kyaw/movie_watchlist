<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>My Watchlist</title>
</head>
<body class="container mt-5">
    <h2>My Movie Watchlist</h2>
    <a href="{{ url_for('movies.create') }}" class="btn btn-primary mb-3"> + Add new movie</a>
    <div class="row">
    {% for movie in movies %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ movie['title'] }}</h5>
                <h6 class="card-subtitle mb-2 text-muted">{{ movie['genre'] }} • {{ movie['release_year'] }}</h6>
                <p class="card-text">{{ movie['notes'] }}</p>
                
                <span class="badge bg-info text-dark">{{ movie['status'] }}</span>
            </div>
            <div class="card-footer bg-transparent border-top-0">
                <a href="/movies/view/{{ movie['id'] }}" class="btn btn-sm btn-outline-primary">View</a>
                <a href="/movies/edit/{{ movie['id'] }}" class="btn btn-sm btn-outline-secondary">Edit</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
</body>
</html>
